# B站会员购抢票脚本配置

# 目标票务页面URL（必须填写）
# 示例：https://show.bilibili.com/platform/detail.html?id=1001653
ticket_url: ""

# 开售时间，格式：YYYY-MM-DD HH:MM:SS（必须填写）
sale_time: ""

# 开售时间偏移量（秒），用于校准本地/服务器时间
# 正数 = 延迟开始（适合本地时间比服务器快）
# 负数 = 提前开始（适合本地时间比服务器慢）
# 例如本地快 2 秒，就填 2
sale_time_offset: 0.0

# 目标场次/日期，支持模糊匹配
# 示例："2026-07-10" / "周五" / "7月10日"
target_date: ""

# 目标票档，支持模糊匹配
# 可选：票档名称 或 价格，如 "VIP票" / "128" / "普通票"
# 留空则默认选择第一个可用票档
target_ticket: ""

# 购票数量，1-4张
ticket_count: 1

# 观演人姓名（需提前在B站账号中添加好）
viewer_name: ""

# 支付方式：wechat / alipay
payment_method: "wechat"

# 测试模式：true=只演练流程，不真正提交订单；false=真实抢票
test_mode: true

# 是否无头运行（抢票建议 false，看得见窗口）
headless: false

# 开售前提前多少秒开始高频刷新（建议 30-60）
countdown_seconds_before: 60

# 提交失败后最大重试次数
max_retry: 30

# 操作间隔基准（秒），建议 0.3-0.8
# 实际间隔会在此基础上有少量随机抖动，并伴随小幅滚动，降低风控概率
# 若频繁出现验证码，可适当调大
action_delay: 0.5
