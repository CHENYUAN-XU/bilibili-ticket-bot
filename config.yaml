# B站会员购抢票脚本配置

# 目标票务页面URL（必须填写）
# 示例：https://show.bilibili.com/platform/detail.html?id=1001653
ticket_url: ""

# 开售时间，格式：YYYY-MM-DD HH:MM:SS（必须填写）
sale_time: ""

# 开售时间所属时区；默认使用中国标准时间，避免电脑切换时区后倒计时偏移
sale_timezone: "Asia/Shanghai"

# 开售时间偏移量（秒），用于校准本地/服务器时间
# 正数 = 延迟开始（适合本地时间比服务器快）
# 负数 = 提前开始（适合本地时间比服务器慢）
# 例如本地快 2 秒，就填 2
sale_time_offset: 0.0

# 目标场次/日期，支持模糊匹配
# 示例："2026-07-10" / "周五" / "7月10日"
target_date: ""

# 目标票档，支持模糊匹配
# 可选：票档名称 或 价格，如 "VIP票" / "128" / "普通票"
# 演练模式留空时使用第一个可用票档，正式模式必须填写
target_ticket: ""

# 购票数量，1-4张
ticket_count: 1

# 观演人姓名（需提前添加好）。留空或购买多张时，请手动核对观演人并提交
viewer_name: ""

# 支付方式：wechat / alipay
payment_method: "wechat"

# 测试模式：true=只演练；false=启动时核对配置并输入活动编号后，允许真实提交
test_mode: true

# 只在演练时允许无头运行，正式模式需要可见窗口
headless: false

# 开售前提前多少秒进入倒计时（建议 30-60）
countdown_seconds_before: 60

# 最多提交次数（含首次，1–30）
max_retry: 30

# 操作间隔基准（秒），建议 0.3-0.8
# 实际间隔会在此基础上有少量随机抖动，并伴随小幅滚动，降低风控概率
# 若频繁出现验证码，可适当调大
action_delay: 0.5

# 测试完成、进入支付页或自动流程失败时保留浏览器，按回车后才关闭
keep_browser_open: true
keep_browser_open_on_failure: true
